# Dify App DSL v0.6.0
#
# Before importing:
# 1. Confirm that the DeepSeek and Tongyi/Qwen providers are installed in Dify.
# 2. Replace YOUR_SEARCH_ADAPTER_HOST with the internal search adapter address.
#    The adapter receives {"query": "...", "context": "..."} and returns
#    {"sources": [{"title": "...", "url": "...", "source_type": "official|manufacturer|secondary", "snippet": "..."}]}.
# 3. The caller must pass the allowed Shopify metafield schema as JSON in metafield_schema.
#
# This is intentionally a Workflow, not a Chatflow. The caller persists the returned
# product_profile and sends it back as previous_product_profile for follow-up questions.
version: "0.6.0"
kind: app
app:
  name: "独立站 3D 打印配件内容助手"
  mode: workflow
  icon: "🧩"
  icon_background: "#D1E9FF"
  description: "识别 3D 打印配件、核验依据并生成独立站商品标题、五点描述与结构化商品档案。"
  use_icon_as_answer_icon: false
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: true
      allowed_file_extensions:
        - .JPG
        - .JPEG
        - .PNG
        - .WEBP
      allowed_file_types:
        - image
      allowed_file_upload_methods:
        - local_file
        - remote_url
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 10
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: true
        number_limits: 10
        transfer_methods:
          - local_file
          - remote_url
    opening_statement: ""
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    nodes:
      - id: "start"
        data:
          type: start
          title: "输入商品信息"
          desc: "图片为可选；previous_product_profile 由调用方保存并在追问时回传。"
          variables:
            - label: "用户问题或产品描述"
              variable: user_query
              type: paragraph
              required: true
              max_length: 4000
              options: []
            - label: "商品图片（最多 5 张）"
              variable: product_images
              type: file-list
              required: false
              max_length: 10
              options: []
            - label: "上一件产品档案 JSON"
              variable: previous_product_profile
              type: paragraph
              required: false
              max_length: 12000
              options: []
            - label: "允许的 Shopify Metafield 字段 JSON"
              variable: metafield_schema
              type: paragraph
              required: false
              max_length: 12000
              options: []
        height: 194
        width: 244
        position: { x: 80, y: 340 }
        positionAbsolute: { x: 80, y: 340 }
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom

      - id: "intent-classifier"
        data:
          type: question-classifier
          title: "判断追问或新产品"
          desc: "仅判断任务路由；上下文由 previous_product_profile 提供。"
          classes:
            - id: "follow-up"
              name: "追问上一件产品"
            - id: "new-product"
              name: "新产品识别或文案生成"
          instructions: |
            将用户输入分到且仅分到一个类别。
            - 追问上一件产品：用户询问上一轮已识别产品的适配、功能、安装、来源或需要补充说明，且未提供新产品。
            - 新产品识别或文案生成：用户提供新产品描述、图片、型号、链接或明确要求生成新的标题/五点描述。
            若存在图片、明显的新型号、新产品名或“重新生成”等表达，优先选择新产品。
          model:
            provider: "langgenius/deepseek/deepseek"
            name: "deepseek-v4-flash"
            mode: chat
            completion_params:
              temperature: 0
          query_variable_selector:
            - "start"
            - "user_query"
          vision:
            enabled: false
        height: 218
        width: 244
        position: { x: 390, y: 340 }
        positionAbsolute: { x: 390, y: 340 }
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom

      - id: "followup-search"
        data:
          type: http-request
          title: "检索追问依据"
          desc: "替换为内网搜索适配器；只返回可访问网页与摘要。"
          method: post
          url: "http://YOUR_SEARCH_ADAPTER_HOST/v1/search"
          authorization:
            type: no-auth
            config: null
          headers: "Content-Type: application/json"
          params: ""
          body:
            type: json
            data:
              - id: "followup-search-body"
                key: "query"
                type: text
                value: "{{#start.user_query#}}"
              - id: "followup-context-body"
                key: "context"
                type: text
                value: "{{#start.previous_product_profile#}}"
          timeout:
            max_connect_timeout: 10
            max_read_timeout: 45
            max_write_timeout: 10
          retry_config:
            retry_enabled: true
            max_retries: 2
            retry_interval: 500
          variables: []
        height: 166
        width: 244
        position: { x: 720, y: 80 }
        positionAbsolute: { x: 720, y: 80 }
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom

      - id: "followup-answer"
        data:
          type: llm
          title: "基于上下文与证据回答"
          desc: "追问分支只回答，不生成新的商品文案。"
          model:
            provider: "langgenius/deepseek/deepseek"
            name: "deepseek-v4-flash"
            mode: chat
            completion_params:
              temperature: 0.2
          prompt_template:
            - role: system
              text: |
                你是 3D 打印配件运营助手。根据上一件产品档案和检索结果回答用户追问。
                规则：
                1. 只能将上一件产品档案或检索结果明确支持的内容表述为事实。
                2. 无法证实的兼容性、材质、用途必须明确说“待确认”，不要补全或猜测。
                3. 在 evidence 中列出每项关键结论对应的 URL；检索结果没有来源时不得引用。
                4. 只输出合法 JSON：
                   {"intent":"follow_up","answer_zh":"","evidence":[{"claim":"","url":"","source_type":"official|manufacturer|secondary"}],"review_required":[""]}
            - role: user
              text: |
                用户问题：{{#start.user_query#}}
                上一件产品档案：{{#start.previous_product_profile#}}
                检索结果：{{#followup-search.body#}}
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: false
        height: 226
        width: 244
        position: { x: 1030, y: 80 }
        positionAbsolute: { x: 1030, y: 80 }
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom

      - id: "product-discovery"
        data:
          type: llm
          title: "提取产品候选与检索线索"
          desc: "图片只用于提出候选，不作为产品事实的最终依据。"
          model:
            provider: "langgenius/tongyi/tongyi"
            name: "qwen3-vl-flash"
            mode: chat
            completion_params:
              temperature: 0.1
          prompt_template:
            - role: system
              text: |
                你负责 3D 打印配件的初步识别。图片和用户描述只能用于提出候选，不能直接形成已核验事实。
                从图片、文字、包装、型号和外观中提取：品牌/型号候选、零件名称候选、可能用途、可能适配机型、替换件或升级件候选、可用于搜索的关键词。
                不知道时使用 unknown，不要臆测。
                仅输出 JSON：
                {"input_mode":"image_and_text|image_only|text_only","candidates":[{"name":"","brand":"","part_type":"","role":"replacement_part|upgrade_part|accessory|unknown","confidence":0.0,"reason":""}],"search_queries":[""],"unresolved_fields":[""]}
            - role: user
              text: |
                用户给出的新产品信息：{{#start.user_query#}}
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: true
            variable_selector:
              - "start"
              - "product_images"
            configs:
              detail: high
        height: 250
        width: 244
        position: { x: 1030, y: 340 }
        positionAbsolute: { x: 1030, y: 340 }
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom

      - id: "product-image-condition"
        data:
          type: if-else
          title: "是否提供了商品图片"
          desc: "只有图片不为空时才进入视觉识别节点，避免文本模式触发视觉变量不能为空。"
          cases:
            - id: "has-images"
              case_id: "has-images"
              logical_operator: and
              conditions:
                - id: "product-images-not-empty"
                  variable_selector:
                    - "start"
                    - "product_images"
                  comparison_operator: not empty
                  value: ""
                  varType: "array[file]"
        height: 150
        width: 244
        position: { x: 720, y: 400 }
        positionAbsolute: { x: 720, y: 400 }
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom

      - id: "product-discovery-text"
        data:
          type: llm
          title: "根据文字提取产品候选"
          desc: "无图片时只依据用户明确提供的描述，不推测适配机型或材质。"
          model:
            provider: "langgenius/deepseek/deepseek"
            name: "deepseek-v4-flash"
            mode: chat
            completion_params:
              temperature: 0.1
          prompt_template:
            - role: system
              text: |
                你负责 3D 打印配件的初步文本识别。只从用户明确给出的文字提取产品候选，不能补充未提供的品牌、型号、适配机型、材质或功能。
                任何未知字段使用 unknown，并将其加入 unresolved_fields。仅输出 JSON：
                {"input_mode":"text_only","candidates":[{"name":"","brand":"","part_type":"","role":"replacement_part|upgrade_part|accessory|unknown","confidence":0.0,"reason":""}],"search_queries":[""],"unresolved_fields":[""]}
            - role: user
              text: |
                用户给出的新产品信息：{{#start.user_query#}}
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: false
        height: 230
        width: 244
        position: { x: 1030, y: 660 }
        positionAbsolute: { x: 1030, y: 660 }
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom

      - id: "discovery-aggregator"
        data:
          type: variable-aggregator
          title: "合并产品识别结果"
          desc: "根据是否有图片，接收视觉识别或纯文本识别的结果。"
          output_type: string
          variables:
            - - "product-discovery"
              - "text"
            - - "product-discovery-text"
              - "text"
        height: 110
        width: 244
        position: { x: 1340, y: 430 }
        positionAbsolute: { x: 1340, y: 430 }
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom

      - id: "product-search"
        data:
          type: http-request
          title: "检索官方与制造商资料"
          desc: "搜索适配器应优先返回官方产品页、说明书和制造商规格页面。"
          method: post
          url: "http://YOUR_SEARCH_ADAPTER_HOST/v1/search"
          authorization:
            type: no-auth
            config: null
          headers: "Content-Type: application/json"
          params: ""
          body:
            type: json
            data:
              - id: "product-search-query"
                key: "query"
                type: text
                value: "{{#discovery-aggregator.output#}}"
              - id: "product-search-context"
                key: "context"
                type: text
                value: "{{#start.user_query#}}"
          timeout:
            max_connect_timeout: 10
            max_read_timeout: 45
            max_write_timeout: 10
          retry_config:
            retry_enabled: true
            max_retries: 2
            retry_interval: 500
          variables: []
        height: 166
        width: 244
        position: { x: 1650, y: 430 }
        positionAbsolute: { x: 1650, y: 430 }
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom

      - id: "evidence-profile"
        data:
          type: llm
          title: "核验产品档案"
          desc: "只有来源直接支持的字段才标记为 verified。"
          model:
            provider: "langgenius/deepseek/deepseek"
            name: "deepseek-v4-flash"
            mode: chat
            completion_params:
              temperature: 0
          prompt_template:
            - role: system
              text: |
                将候选产品与检索资料做实体匹配和事实核验。
                来源优先级：官方产品页/说明书 > 打印机制造商官方资料 > 可信经销商资料。图片本身不能作为适配性事实依据。
                每个适配品牌、适配机型、材质、功能、零件角色都必须有单独 evidence；没有直接支持则状态为 needs_review。
                仅输出 JSON：
                {"product_profile":{"identified_product":"","brand":"","part_type":"","product_role":"replacement_part|upgrade_part|accessory|unknown","compatible_brands":[],"compatible_models":[],"functions":[],"materials":[]},"evidence":[{"claim":"","status":"verified|inferred|needs_review","url":"","source_type":"official|manufacturer|secondary","reason":""}],"review_required":[""]}
            - role: user
              text: |
                用户描述：{{#start.user_query#}}
                初步候选：{{#discovery-aggregator.output#}}
                检索结果：{{#product-search.body#}}
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: false
        height: 250
        width: 244
        position: { x: 1960, y: 430 }
        positionAbsolute: { x: 1960, y: 430 }
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom

      - id: "content-draft"
        data:
          type: llm
          title: "生成商品文案与候选元字段"
          desc: "严格区分商品标题与 SEO 元数据。"
          model:
            provider: "langgenius/deepseek/deepseek"
            name: "deepseek-v4-flash"
            mode: chat
            completion_params:
              temperature: 0.35
          prompt_template:
            - role: system
              text: |
                基于已核验产品档案生成独立站商品内容。不要把 status 不是 verified 的事实写成确定性陈述。
                若 input_mode 为 text_only，只可使用用户明确提供的事实；适配机型、材质和产品功能等未知字段必须留空并加入 review_required。

                输出必须是合法 JSON，字段不可省略：
                {
                  "intent":"new_product",
                  "listing_content":{
                    "product_titles_en":["","", ""],
                    "product_titles_zh":["","", ""],
                    "five_bullets_en":["","","","", ""],
                    "five_bullets_zh":["","","","", ""],
                    "seo_title_en":"",
                    "meta_description_en":""
                  },
                  "product_profile":{},
                  "evidence":[],
                  "metafield_candidates":[{"key":"","type":"","value":"","confidence":0.0,"evidence_claims":[]}],
                  "review_required":[]
                }

                规则：
                - product_titles_en 必须正好 3 个，每个 110 到 128 个字符；它们是商品标题，不是 SEO Title。
                - five_bullets_en 必须正好 5 条，每条格式严格为 Short Heading: Description，使用 ASCII 冒号且冒号后一个空格。
                - 中文仅为运营审核参考，不受英文商品标题字符数限制。
                - seo_title_en 和 meta_description_en 单独生成，简洁、不堆砌关键词。
                - metafield_candidates 只能使用调用方传入 schema 中存在的 key/type/allowed_values；否则不要输出该字段。
            - role: user
              text: |
                用户描述：{{#start.user_query#}}
                初步识别：{{#discovery-aggregator.output#}}
                已核验产品档案：{{#evidence-profile.text#}}
                允许的 Metafield schema：{{#start.metafield_schema#}}
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: false
        height: 310
        width: 244
        position: { x: 2270, y: 430 }
        positionAbsolute: { x: 2270, y: 430 }
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom

      - id: "validate-draft"
        data:
          type: code
          title: "代码校验标题与五点格式"
          desc: "确定性校验，不依赖大模型判断字符数与冒号格式。"
          code_language: python3
          code: |
            import json
            import re

            def normalize(value):
                return re.sub(r"\\s+", " ", str(value or "").strip())

            def validate_payload(draft):
                errors = []
                listing = draft.get("listing_content", {}) if isinstance(draft, dict) else {}
                titles = listing.get("product_titles_en", [])
                bullets = listing.get("five_bullets_en", [])

                if not isinstance(titles, list) or len(titles) != 3:
                    errors.append("product_titles_en 必须正好包含 3 个标题")
                else:
                    normalized_titles = []
                    for index, title in enumerate(titles, start=1):
                        title = normalize(title)
                        normalized_titles.append(title)
                        length = len(title)
                        if length < 110 or length > 128:
                            errors.append(f"英文商品标题 {index} 的长度为 {length}，必须在 110-128 之间")
                    listing["product_titles_en"] = normalized_titles

                if not isinstance(bullets, list) or len(bullets) != 5:
                    errors.append("five_bullets_en 必须正好包含 5 条")
                else:
                    normalized_bullets = []
                    for index, bullet in enumerate(bullets, start=1):
                        bullet = normalize(bullet)
                        normalized_bullets.append(bullet)
                        if bullet.count(":") != 1 or not re.match(r"^[^:]+: [^:].+$", bullet):
                            errors.append(f"英文五点 {index} 必须使用 Short Heading: Description，且只能有一个英文冒号")
                    listing["five_bullets_en"] = normalized_bullets

                draft["listing_content"] = listing
                return draft, errors

            def main(draft_text: str) -> dict:
                try:
                    draft = json.loads(draft_text)
                except Exception as exc:
                    return {
                        "normalized_draft": draft_text,
                        "validation_report": json.dumps({"valid": False, "errors": [f"输出不是合法 JSON: {exc}"]}, ensure_ascii=False)
                    }
                normalized, errors = validate_payload(draft)
                return {
                    "normalized_draft": json.dumps(normalized, ensure_ascii=False),
                    "validation_report": json.dumps({"valid": len(errors) == 0, "errors": errors}, ensure_ascii=False)
                }
          variables:
            - variable: draft_text
              value_selector:
                - "content-draft"
                - "text"
          outputs:
            normalized_draft:
              type: string
            validation_report:
              type: string
        height: 286
        width: 244
        position: { x: 2580, y: 430 }
        positionAbsolute: { x: 2580, y: 430 }
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom

      - id: "repair-draft"
        data:
          type: llm
          title: "按校验报告修复文案"
          desc: "最多一次自动修复；保留未报错且有依据的字段。"
          model:
            provider: "langgenius/deepseek/deepseek"
            name: "deepseek-v4-flash"
            mode: chat
            completion_params:
              temperature: 0.15
          prompt_template:
            - role: system
              text: |
                你只修复校验报告中指出的问题，保留其余内容与 JSON 结构。不要添加没有证据支持的产品事实。
                product_titles_en 必须正好 3 个，且每个 110-128 字符；five_bullets_en 必须正好 5 条，格式为 Short Heading: Description。
                只输出修复后的合法 JSON，不要使用 Markdown 代码块。
            - role: user
              text: |
                原始结果：{{#validate-draft.normalized_draft#}}
                校验报告：{{#validate-draft.validation_report#}}
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: false
        height: 214
        width: 244
        position: { x: 2890, y: 430 }
        positionAbsolute: { x: 2890, y: 430 }
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom

      - id: "final-validator"
        data:
          type: code
          title: "最终代码校验"
          desc: "自动修复后仍不合格时只标记质量状态，不无限重试。"
          code_language: python3
          code: |
            import json
            import re

            def normalize(value):
                return re.sub(r"\\s+", " ", str(value or "").strip())

            def main(result_text: str) -> dict:
                try:
                    result = json.loads(result_text)
                except Exception as exc:
                    return {
                        "final_result": result_text,
                        "quality_report": json.dumps({"status": "needs_review", "errors": [f"最终结果不是合法 JSON: {exc}"]}, ensure_ascii=False)
                    }
                errors = []
                listing = result.get("listing_content", {})
                titles = listing.get("product_titles_en", [])
                bullets = listing.get("five_bullets_en", [])
                if not isinstance(titles, list) or len(titles) != 3:
                    errors.append("英文商品标题数量不为 3")
                else:
                    for i, value in enumerate(titles, 1):
                        length = len(normalize(value))
                        if length < 110 or length > 128:
                            errors.append(f"英文商品标题 {i} 长度 {length} 不在 110-128")
                if not isinstance(bullets, list) or len(bullets) != 5:
                    errors.append("英文五点数量不为 5")
                else:
                    for i, value in enumerate(bullets, 1):
                        value = normalize(value)
                        if value.count(":") != 1 or not re.match(r"^[^:]+: [^:].+$", value):
                            errors.append(f"英文五点 {i} 格式不符合 Short Heading: Description")
                result["quality_status"] = "passed" if not errors else "needs_review"
                if errors:
                    result.setdefault("review_required", []).extend(errors)
                return {
                    "final_result": json.dumps(result, ensure_ascii=False),
                    "quality_report": json.dumps({"status": result["quality_status"], "errors": errors}, ensure_ascii=False)
                }
          variables:
            - variable: result_text
              value_selector:
                - "repair-draft"
                - "text"
          outputs:
            final_result:
              type: string
            quality_report:
              type: string
        height: 270
